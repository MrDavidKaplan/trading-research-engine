[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-engine"
version = "1.0.0"
description = "Auditable signal research and event-driven execution simulation in Python and C++"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tradeengine = "tradeengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
